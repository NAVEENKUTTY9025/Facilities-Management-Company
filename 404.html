<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>404 — Page Not Found | Facilitas</title>
  <link rel="icon" type="image/png" href="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=64&h=64&fit=crop">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ===== RESET & BASE ===== */
    * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== COLOR SYSTEM (Black, White, Copper) ===== */
    :root {
      --bg-primary: #FFFFFF;
      --text-primary: #000000;
      --card-bg: #FFFFFF;
      --border-color: #E5E7EB;
      --copper: #B87333;
      --copper-dark: #9A5F2A;
      --muted: #6B7280;
    }

    .dark {
      --bg-primary: #0A0A0A;
      --text-primary: #F5F5F5;
      --card-bg: #141414;
      --border-color: #2A2A2A;
      --muted: #9CA3AF;
    }

    /* ===== CRITICAL: NO SCROLL ANYWHERE ===== */
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1rem;
      position: relative;
    }

    /* ===== BRAND ===== */
    .logo-icon, .logo-text { color: #B87333 !important; }
    .logo-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-decoration: none;
      line-height: 1;
    }

    /* ===== TOP-RIGHT CONTROLS ===== */
    .top-controls {
      position: fixed;
      top: 0.85rem;
      right: 0.85rem;
      z-index: 50;
      display: flex;
      gap: 0.45rem;
    }
    [dir="rtl"] .top-controls {
      right: auto;
      left: 0.85rem;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(184, 115, 51, 0.14);
      border: 1px solid rgba(184, 115, 51, 0.25);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .ctrl-btn:hover { background: rgba(184, 115, 51, 0.28); }

    /* ===== 404 CARD (centered, no inner scroll) ===== */
    .notfound-shell {
      width: 100%;
      max-width: 460px;
      max-height: calc(100dvh - 2rem);
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -18px rgba(0, 0, 0, 0.25);
      padding: 2rem 1.8rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .notfound-shell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #B87333, #D4A373, #B87333);
    }

    /* Big 404 number */
    .error-code {
      font-size: clamp(4.5rem, 18vw, 7rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #B87333 0%, #D4A373 55%, #B87333 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }

    .btn-copper {
      background-color: #B87333;
      color: #fff;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .btn-copper:hover { background-color: #9A5F2A; }
    .btn-copper:active { transform: scale(0.985); }

    /* Decorative compass circle */
    .compass-ring {
      width: 3.6rem;
      height: 3.6rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(184, 115, 51, 0.1);
      border: 1px solid rgba(184, 115, 51, 0.3);
      margin: 0 auto 0.9rem;
    }

    /* ===== RTL ===== */
    [dir="rtl"] { text-align: right; direction: rtl; }
    [dir="rtl"] .notfound-shell { text-align: center; }

    /* ===== FLOAT ANIMATION ===== */
    @keyframes softFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .animate-soft-float { animation: softFloat 4s ease-in-out infinite; }

    /* ===== RESPONSIVE (fits without scroll) ===== */
    @media (max-height: 620px) {
      .notfound-shell { padding: 1.3rem 1.3rem 1.1rem; max-width: 420px; }
      .error-code { font-size: 4rem; }
      .compass-ring { width: 3rem; height: 3rem; margin-bottom: 0.6rem; }
    }
    @media (max-width: 360px) {
      .notfound-shell { padding: 1.4rem 1rem 1.1rem; }
    }
  </style>
  <script>
    if (typeof tailwind !== 'undefined') {
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { colors: { primary: '#B87333', copper: '#B87333', black: '#000000' } } }
      }
    }
  </script>
</head>
<body>

  <!-- ===== TOP-RIGHT CONTROLS: RTL + DARK MODE ===== -->
  <div class="top-controls">
    <button onclick="toggleDirection()" class="ctrl-btn" aria-label="Toggle text direction">
      <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
      <span id="dirText">LTR</span>
    </button>
    <button onclick="toggleTheme()" class="ctrl-btn" aria-label="Toggle dark mode">
      <i data-lucide="moon" class="w-3.5 h-3.5 dark:hidden"></i>
      <i data-lucide="sun" class="w-3.5 h-3.5 hidden dark:block text-yellow-400"></i>
    </button>
  </div>

  <!-- ===== CENTERED 404 CARD ===== -->
  <main class="notfound-shell">

    <!-- Logo → index.html -->
    <a href="index.html" class="logo-brand flex items-center justify-center gap-2 mb-5">
      <i data-lucide="building-2" class="w-7 h-7 sm:w-8 sm:h-8 logo-icon"></i>
      <span class="text-2xl sm:text-3xl font-black tracking-tight">
        <span class="logo-text">Facil</span><span class="logo-text">itas</span>
      </span>
    </a>

    <!-- Compass icon -->
    <div class="compass-ring animate-soft-float">
      <i data-lucide="compass" class="w-7 h-7 text-[#B87333]"></i>
    </div>

    <!-- Big 404 -->
    <div class="error-code">404</div>

    <!-- Heading + copy -->
    <h1 class="text-xl sm:text-2xl font-extrabold mt-1 mb-2" style="color: var(--text-primary);">
      Page Not Found
    </h1>
    <p class="text-sm leading-relaxed max-w-sm mb-6" style="color: var(--muted);">
      The page you're looking for may have been moved, renamed, or is temporarily unavailable. Let's get you back on track.
    </p>

    <!-- Actions -->
    <div class="w-full flex flex-col sm:flex-row gap-2.5">
      <a href="index.html" class="btn-copper flex-1 py-2.5 rounded-xl font-bold text-sm shadow-md inline-flex items-center justify-center gap-2">
        <i data-lucide="home" class="w-4 h-4"></i> Back to Home
      </a>
      <a href="contact.html" class="flex-1 py-2.5 rounded-xl font-bold text-sm border-2 border-[#B87333] text-[#B87333] hover:bg-[#B87333] hover:text-white transition inline-flex items-center justify-center gap-2">
        <i data-lucide="headset" class="w-4 h-4"></i> Contact Us
      </a>
    </div>

    <!-- Quick links -->
    <div class="w-full mt-6 pt-5 border-t" style="border-color: var(--border-color);">
      <p class="text-[0.65rem] font-bold uppercase tracking-widest mb-3" style="color: var(--muted);">Popular Pages</p>
      <div class="flex flex-wrap justify-center gap-x-4 gap-y-2">
        <a href="services.html" class="text-xs font-semibold hover:underline" style="color: var(--copper);">Services</a>
        <a href="about.html" class="text-xs font-semibold hover:underline" style="color: var(--copper);">About</a>

        <a href="blog.html" class="text-xs font-semibold hover:underline" style="color: var(--copper);">Blog</a>
        <a href="faq.html" class="text-xs font-semibold hover:underline" style="color: var(--copper);">FAQ</a>
        <a href="gallery.html" class="text-xs font-semibold hover:underline" style="color: var(--copper);">Gallery</a>
      </div>
    </div>

  </main>

  <script>
    /* ===== INIT ICONS ===== */
    lucide.createIcons();

    /* ===== THEME TOGGLE ===== */
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      setTimeout(() => lucide.createIcons(), 10);
    }

    /* ===== RTL / LTR TOGGLE ===== */
    function toggleDirection() {
      const html = document.documentElement;
      const label = document.getElementById('dirText');
      if (html.dir === 'rtl') {
        html.dir = 'ltr';
        if (label) label.innerText = 'LTR';
      } else {
        html.dir = 'rtl';
        if (label) label.innerText = 'RTL';
      }
      setTimeout(() => lucide.createIcons(), 50);
    }

    /* ===== LOAD SAVED THEME ===== */
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }

    /* ===== PREVENT ACCIDENTAL SCROLL ===== */
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
